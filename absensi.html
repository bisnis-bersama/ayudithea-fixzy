<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Absensi Karyawan</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font:15px Arial,sans-serif}.top{background:#171717;color:#fff;padding:18px 22px;border-bottom:3px solid #eab308}.top b{color:#facc15;font-size:22px}.layout{display:flex;min-height:calc(100vh - 65px)}aside{width:220px;background:#202020;padding:16px;display:flex;flex-direction:column;gap:8px}aside a{color:#eee;text-decoration:none;padding:11px;border-radius:8px;font-size:14px}aside a:hover,aside a.active{background:#3b3214;color:#ffda46}main{padding:24px;width:100%;max-width:1200px;margin:auto}h1{margin:0 0 6px}.muted{color:#667085;margin:0 0 20px}.card{background:white;border:1px solid #e2e5e9;border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:600;font-size:13px;margin-bottom:12px}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #cbd0d8;border-radius:8px;margin-top:6px;font:inherit;background:#fff}button,.btn{border:0;background:#eab308;color:#171717;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}button.secondary{background:#252525;color:#fff}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f9fafb}.tablewrap{overflow:auto}.status{margin-left:10px;color:#16803d}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:700px){.layout{display:block}aside{width:100%;flex-direction:row;overflow:auto}aside a{white-space:nowrap}main{padding:14px}}</style></head><body><header class="top"><b>FIXZY</b> <span>• Absensi Karyawan</span></header><div class="layout"><aside><a href="index.html">▦ Dashboard</a><a href="servis.html">＋ Input Servis</a><a href="penjualan.html">▣ Penjualan</a><a href="stok.html">▤ Stok Produk</a><a href="pengeluaran.html">↘ Pengeluaran</a><a href="data.html">☷ Data Transaksi</a><a href="pengaturan.html">⚙ Pengaturan</a><a href="karyawan.html">👥 Data Karyawan</a><a href="absensi.html">🗓 Absensi</a><a href="upah.html">💰 Upah Bulanan</a></aside><main><h1>Absensi Karyawan</h1><p class="muted">Catat status harian setiap karyawan. Upah harian hanya dihitung untuk status Hadir.</p><form id="f" class="card grid"><label>Tanggal<input type="date" name="tanggal" required></label><label>Karyawan<select name="karyawanId" id="emp" required></select></label><label>Status<select name="status"><option>Hadir</option><option>Libur</option><option>Izin</option><option>Sakit</option></select></label><label>Catatan<input name="catatan"></label><div><button>Simpan Absensi</button><span id="msg" class="status"></span></div></form><section class="card"><div class="row"><h2 style="margin-right:auto">Rekap Absensi</h2><input id="bulan" type="month"><button type="button" onclick="loadRows()">Tampilkan</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Status</th><th>Catatan</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>const FIXZY_API_URL='';const $=s=>document.querySelector(s);const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');async function get(a){if(!FIXZY_API_URL)throw Error('Isi URL Apps Script pada konstanta FIXZY_API_URL.');let u=new URL(FIXZY_API_URL);let parts=a.split('&');u.searchParams.set('action',parts.shift());parts.forEach(x=>{let z=x.split('=');u.searchParams.set(z[0],decodeURIComponent(z.slice(1).join('=')))});let r=await fetch(u);let j=await r.json();if(!j.ok)throw Error(j.message||'Gagal');return j}async function post(d){if(!FIXZY_API_URL)throw Error('Isi URL Apps Script pada konstanta FIXZY_API_URL.');let r=await fetch(FIXZY_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});let j=await r.json();if(!j.ok)throw Error(j.message||'Gagal');return j}function msg(t){$('#msg').textContent=t}
$('#f').elements.tanggal.value=new Date().toISOString().slice(0,10);$('#bulan').value=new Date().toISOString().slice(0,7);async function init(){{try{{let j=await get('karyawan');$('#emp').innerHTML=(j.data||[]).filter(x=>(x.Status||'Aktif')==='Aktif').map(x=>`<option value="${{x.ID}}">${{x.Nama}}</option>`).join('');await loadRows()}}catch(e){{msg(e.message)}}}}async function loadRows(){{try{{let j=await get('absensi&bulan='+encodeURIComponent($('#bulan').value));$('#rows').innerHTML=(j.data||[]).map(x=>`<tr><td>${{x.Tanggal}}</td><td>${{x.Nama}}</td><td>${{x.Status}}</td><td>${{x.Catatan||''}}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada data.</td></tr>'}}catch(e){{msg(e.message)}}}}$('#f').onsubmit=async e=>{{e.preventDefault();try{{let d=Object.fromEntries(new FormData(e.target));let j=await post({{action:'saveabsensi',...d}});msg(j.message);await loadRows()}}catch(x){{msg(x.message)}}}};init();</script></body></html>
