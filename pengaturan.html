<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Pengaturan</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font:15px Arial,sans-serif}.top{background:#171717;color:#fff;padding:18px 22px;border-bottom:3px solid #eab308}.top b{color:#facc15;font-size:22px}.layout{display:flex;min-height:calc(100vh - 65px)}aside{width:220px;background:#202020;padding:16px;display:flex;flex-direction:column;gap:8px}aside a{color:#eee;text-decoration:none;padding:11px;border-radius:8px;font-size:14px}aside a:hover,aside a.active{background:#3b3214;color:#ffda46}main{padding:24px;width:100%;max-width:1200px;margin:auto}h1{margin:0 0 6px}.muted{color:#667085;margin:0 0 20px}.card{background:white;border:1px solid #e2e5e9;border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:600;font-size:13px;margin-bottom:12px}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #cbd0d8;border-radius:8px;margin-top:6px;font:inherit;background:#fff}button,.btn{border:0;background:#eab308;color:#171717;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}button.secondary{background:#252525;color:#fff}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f9fafb}.tablewrap{overflow:auto}.status{margin-left:10px;color:#16803d}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:700px){.layout{display:block}aside{width:100%;flex-direction:row;overflow:auto}aside a{white-space:nowrap}main{padding:14px}}</style></head><body><header class="top"><b>FIXZY</b> <span>• Pengaturan</span></header><div class="layout"><aside><a href="index.html">▦ Dashboard</a><a href="servis.html">＋ Input Servis</a><a href="penjualan.html">▣ Penjualan</a><a href="stok.html">▤ Stok Produk</a><a href="pengeluaran.html">↘ Pengeluaran</a><a href="data.html">☷ Data Transaksi</a><a href="pengaturan.html">⚙ Pengaturan</a><a href="karyawan.html">👥 Data Karyawan</a><a href="absensi.html">🗓 Absensi</a><a href="upah.html">💰 Upah Bulanan</a></aside><main><h1>Pengaturan</h1><p class="muted">Atur identitas usaha dan periode upah.</p><form id="settings" class="card grid"><label>Nama usaha<input name="namaUsaha" required></label><label>Periode upah mulai tanggal<input name="tanggalMulai" type="number" min="1" max="28" value="1" required></label><label>Metode upah<select name="metodeUpah"><option value="harian">Harian berdasarkan absensi hadir</option></select></label><div><button>Simpan Pengaturan</button><span id="msg" class="status"></span></div></form></main></div><script>const FIXZY_API_URL='';const $=s=>document.querySelector(s);const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');async function get(a){if(!FIXZY_API_URL)throw Error('Isi URL Apps Script pada konstanta FIXZY_API_URL.');let u=new URL(FIXZY_API_URL);u.searchParams.set('action',a);let r=await fetch(u);let j=await r.json();if(!j.ok)throw Error(j.message||'Gagal');return j}async function post(d){if(!FIXZY_API_URL)throw Error('Isi URL Apps Script pada konstanta FIXZY_API_URL.');let r=await fetch(FIXZY_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});let j=await r.json();if(!j.ok)throw Error(j.message||'Gagal');return j}function msg(t){$('#msg').textContent=t}
async function load(){{try{{let j=await get('pengaturan');let d=j.data||{{}};Object.keys(d).forEach(k=>{{let e=$('#settings').elements[k];if(e)e.value=d[k]}})}}catch(e){{msg(e.message)}}}}$('#settings').onsubmit=async e=>{{e.preventDefault();try{{let d=Object.fromEntries(new FormData(e.target));let j=await post({{action:'savepengaturan',...d}});msg(j.message)}}catch(x){{msg(x.message)}}}};load();</script></body></html>
